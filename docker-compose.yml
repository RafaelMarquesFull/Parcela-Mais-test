services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: file:/app/data/app.db
      SIMULACAO_CENARIOS: "true"
      LIMITE_CONCORRENCIA: 5
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      JWT_SECRET: ${JWT_SECRET:-segredo-so-para-demonstracao-local}
      ORIGEM_FRONT: http://localhost:5173
    volumes:
      - dados:/app/data

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  dados:
